<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FINTECH Circle Content Studio</title>
<link rel="icon" type="image/png" href="fintech-circle-logo.png">
<meta name="robots" content="noindex, nofollow">
<link rel="stylesheet" href="core.css?v=20261127124500">
<link rel="stylesheet" href="x.css?v=20261127124500">
<link rel="stylesheet" href="linkedin.css?v=20261127124500">
<link rel="stylesheet" href="studio.css?v=20261127124500">
</head>
<body>
<header class="topbar">
  <div class="brand">
    <img class="brand-logo" src="fintech-circle-logo.png" alt="FINTECH Circle" width="96" height="46">
    <div>
      <div class="brand-title" id="btitle">FINTECH Circle Content Studio</div>
      <div class="brand-sub">As it appears in the LinkedIn iOS app</div>
      <div class="brand-links"><a href="ideas/index.html">Ideas</a> · <a href="examples.html">Format gallery</a> · <a href="guide.html">How to make content</a> · <a href="tantra-invites.html">Tantra invite test</a></div>
    </div>
  </div>
  <div class="controls">
    <div class="tally" id="tally"></div><span class="syncb" id="sync"></span>
    <div class="seg2" title="Which posts to show">
      <button data-filter="all" class="on">All</button>
      <button data-filter="todo">Needs review</button>
      <button data-filter="approved">Approved</button>
    </div>
    <button id="fit3" class="btn ghost on" title="Scale phones so three sit side by side">3 per row</button>
    <div class="seg" title="Phone size">
      <button data-set="scale" data-val="1">100%</button>
      <button data-set="scale" data-val="0.85">85%</button>
      <button data-set="scale" data-val="0.7">70%</button>
    </div>
  </div>
</header>
<div class="banner" id="banner" hidden></div>
<div class="layout">
  <nav class="sidenav" id="sidenav" aria-label="Posts"></nav>
  <main id="main"></main>
</div>
<div class="toast" id="toast">Saved</div>
<script src="core.js?v=20261127124500"></script>
<script src="x.js?v=20261127124500"></script>
<script src="linkedin.js?v=20261127124500"></script>
<script src="data.js?v=20261127124500"></script>
<script src="app.js?v=20261127124500"></script>
</body>
</html>
